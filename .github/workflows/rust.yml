name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93 with rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93 with Clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features --locked

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  unit-tests:
    name: Unit tests (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default features
            args: ""
          - name: all features
            args: --all-features
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@70233fe3d27d863712ee34eede2087e36bde6b5e # v2.8.2
        with:
          tool: nextest
      - name: Run unit tests
        run: cargo nextest run --locked -p pubky-noise ${{ matrix.features.args }}

  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Run doctests
        run: cargo test --locked -p pubky-noise --doc --all-features

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.93"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@70233fe3d27d863712ee34eede2087e36bde6b5e # v2.8.2
        with:
          tool: nextest
      - name: Run end-to-end tests
        run: cargo nextest run --locked -p e2e

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust 1.89
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-21
        with:
          toolchain: "1.89"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Check MSRV compatibility
        run: cargo check --locked --workspace --all-targets --all-features

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan dependencies for vulnerabilities
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # quick-xml fixes require an upstream E2E-stack migration; RSA has no fixed release.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0194,RUSTSEC-2026-0195

  ci-success:
    name: CI success
    if: always()
    needs:
      - format
      - clippy
      - build
      - rustdoc
      - unit-tests
      - doctests
      - e2e-tests
      - msrv
      - rustsec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify required jobs succeeded
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          DOCTESTS_RESULT: ${{ needs.doctests.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          RUSTSEC_RESULT: ${{ needs.rustsec.result }}
        run: |
          for result in \
            "$FORMAT_RESULT" \
            "$CLIPPY_RESULT" \
            "$BUILD_RESULT" \
            "$RUSTDOC_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$DOCTESTS_RESULT" \
            "$E2E_TESTS_RESULT" \
            "$MSRV_RESULT" \
            "$RUSTSEC_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required CI job result: $result"
              exit 1
            fi
          done
